<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- get github username from search -->

        <h1>GitHub User Repositories Search</h1>

    <!-- displays repositories -->
    <main>
        <div id="gallery" class="repo-gallery"></div>
    </main>

</body>
